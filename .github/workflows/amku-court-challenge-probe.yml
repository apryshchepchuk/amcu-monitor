name: AMCU Court Challenge Probe

"on":
  workflow_dispatch:
    inputs:
      year:
        description: "EDRSR year to scan"
        required: true
        default: "2026"
        type: choice
        options:
          - "2026"
          - "2025"

      max_cases:
        description: "Max prefiltered cases to inspect (0 = all)"
        required: false
        default: "0"

      focus_decision:
        description: "Optional AMCU decision number for report/debug emphasis (e.g. 393-р)"
        required: false
        default: "393-р"

      workers:
        description: "Concurrent EDRSR text fetch workers"
        required: false
        default: "4"

      max_gemini_calls:
        description: "Maximum Gemini classification calls"
        required: false
        default: "30"

      skip_gemini:
        description: "Diagnostic only: find candidates without Gemini classification"
        required: false
        default: false
        type: boolean

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore EDRSR court-text cache
        uses: actions/cache@v4
        with:
          path: data/tmp/amku_court_challenge_cache/v4/texts
          key: amku-court-texts-v5-${{ inputs.year }}-${{ github.run_id }}
          restore-keys: |
            amku-court-texts-v5-${{ inputs.year }}-
            amku-court-texts-v4-${{ inputs.year }}-

      - name: Run diagnostic probe
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
        run: |
          EXTRA_ARGS=()
          if [ "${{ inputs.skip_gemini }}" = "true" ]; then
            EXTRA_ARGS+=(--skip-gemini)
          fi

          python scripts/amku_court_challenge_probe.py \
            --year "${{ inputs.year }}" \
            --practice "data/practice/amku_practice.json" \
            --out-dir "data/tmp/amku_court_challenge_probe" \
            --cache-dir "data/tmp/amku_court_challenge_cache/v4" \
            --max-cases "${{ inputs.max_cases }}" \
            --focus-decision "${{ inputs.focus_decision }}" \
            --workers "${{ inputs.workers }}" \
            --request-delay-ms 0 \
            --request-timeout 45 \
            --retries 4 \
            --max-gemini-calls "${{ inputs.max_gemini_calls }}" \
            --gemini-rpm-limit 5 \
            --gemini-max-text-chars 30000 \
            "${EXTRA_ARGS[@]}"

      - name: Print report
        if: always()
        shell: bash
        run: |
          if [ -f data/tmp/amku_court_challenge_probe/report.md ]; then
            cat data/tmp/amku_court_challenge_probe/report.md
          fi

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amku-court-challenge-probe-${{ inputs.year }}
          path: data/tmp/amku_court_challenge_probe/
          if-no-files-found: warn
          retention-days: 14
