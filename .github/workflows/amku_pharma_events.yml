name: AMCU Pharma Events Digest

on:
  # Main run at 06:15 Kyiv time. The second run is a same-day safety net:
  # the script's sent_digests state prevents a duplicate successful email.
  schedule:
    - cron: "15 6 * * 1"
      timezone: "Europe/Kyiv"
    - cron: "15 8 * * 1"
      timezone: "Europe/Kyiv"

  workflow_dispatch:
    inputs:
      period_mode:
        description: "Digest period: weekly, monthly, or custom"
        required: false
        default: "weekly"
        type: choice
        options:
          - weekly
          - monthly
          - custom

      date_from:
        description: "Only for custom mode: YYYY-MM-DD"
        required: false
        default: ""

      date_to:
        description: "Only for custom mode: YYYY-MM-DD"
        required: false
        default: ""

      send_email:
        description: "Send email digest"
        required: false
        default: false
        type: boolean

      test_email_send:
        description: "Send a TEST email even in dry-run (does not mark period as sent)"
        required: false
        default: false
        type: boolean

      send_empty_email:
        description: "Send email even if no pharma events found"
        required: false
        default: false
        type: boolean

      force_send:
        description: "Resend digest even if this period was already sent"
        required: false
        default: false
        type: boolean

      skip_gemini:
        description: "Scout mode: skip Gemini and use only pharma keyword prefilter"
        required: false
        default: false
        type: boolean

      dry_run:
        description: "Do not write data/state and do not send email"
        required: false
        default: true
        type: boolean

      max_gemini_calls:
        description: "Max Gemini calls per run"
        required: false
        default: "40"

concurrency:
  group: amcu-pharma-events
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate scheduled-run secrets
        if: ${{ github.event_name == 'schedule' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          set -euo pipefail
          for name in GEMINI_API_KEY SMTP_USER SMTP_PASS EMAIL_TO; do
            if [ -z "${!name}" ]; then
              echo "::error::Required repository secret is missing: ${name}"
              exit 1
            fi
          done

      - name: Ensure PDF text extractor
        run: |
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi

      - name: Install Node dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "::warning::package-lock.json is missing; using npm install. Add and commit a lockfile for reproducible installs."
            npm install --no-audit --no-fund
          fi

      - name: Check script syntax
        run: node --check scripts/amku_pharma_events.mjs

      - name: Run AMCU pharma events digest
        env:
          PERIOD_MODE: ${{ github.event.inputs.period_mode || 'weekly' }}
          DATE_FROM: ${{ github.event.inputs.date_from || '' }}
          DATE_TO: ${{ github.event.inputs.date_to || '' }}

          # Scheduled runs are production sends; manual runs keep their safe defaults.
          SEND_EMAIL: ${{ github.event_name == 'schedule' && 'true' || github.event.inputs.send_email || 'false' }}
          TEST_EMAIL_SEND: ${{ github.event_name == 'schedule' && 'false' || github.event.inputs.test_email_send || 'false' }}
          SEND_EMPTY_EMAIL: ${{ github.event_name == 'schedule' && 'false' || github.event.inputs.send_empty_email || 'false' }}
          FORCE_SEND: ${{ github.event_name == 'schedule' && 'false' || github.event.inputs.force_send || 'false' }}
          SKIP_GEMINI: ${{ github.event_name == 'schedule' && 'false' || github.event.inputs.skip_gemini || 'false' }}
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || github.event.inputs.dry_run || 'true' }}
          MAX_GEMINI_CALLS: ${{ github.event.inputs.max_gemini_calls || '40' }}

          PDF_FALLBACK_ENABLED: "true"
          PDF_PREFILTER_PAGES: "3"
          MAX_PDFS_PER_PAGE: "3"
          MAX_PDF_BYTES: "25000000"
          TIMELINE_LANG: "uk"

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}

          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TEST_EMAIL_TO: ${{ secrets.TEST_EMAIL_TO }}

        run: node scripts/amku_pharma_events.mjs

      - name: Commit AMCU pharma events data
        if: ${{ github.event_name == 'schedule' || github.event.inputs.dry_run == 'false' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/amku_pharma_events.json
          git add data/amku_pharma_events_state.json

          if git diff --cached --quiet; then
            echo "No AMCU pharma events data changes to commit."
          else
            git commit -m "Update AMCU pharma events digest data"
            git push
          fi
